[build-system]
# setuptools>=77 for PEP 639 (`license` as an SPDX expression +
# `license-files`). The old table form is deprecated portfolio-wide, with
# removal announced 2027-02-18. VERIFIED, not assumed:
# setuptools 77.0.3, 78.1.1 and 80.9.0 all declare Requires-Python >=3.9,
# so raising this floor does not conflict with this package's 3.9 floor.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmtc-mapper"
version = "0.6.0"
description = "Automated NMTC eligibility checker — geocode addresses and check Low-Income Community status using CDFI Fund and Census data"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jay Patel", email = "thejaypatel1511@gmail.com"}]
dependencies = [
    "aiohttp>=3.8.0",
    "tqdm>=4.64.0",
    "pandas>=1.4.0",
    "numpy>=1.21.0",
    "requests>=2.27.0",
    "openpyxl>=3.1.0",
    "pyxlsb>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://jaypatel1511.github.io/cdfi-superpowers/"
Repository = "https://github.com/Jaypatel1511/nmtc-mapper"
Documentation = "https://github.com/Jaypatel1511/nmtc-mapper#readme"
Issues = "https://github.com/Jaypatel1511/nmtc-mapper/issues"
Changelog = "https://github.com/Jaypatel1511/nmtc-mapper/blob/main/CHANGELOG.md"

# Explicit discovery: the repo root also contains a generated `site/` (mkdocs
# output) and `docs/`, `examples/` dirs. With the setup.py pin removed, build-time
# auto-discovery would error on multiple top-level candidates — pin it to the
# real package. (find_packages() in the old setup.py did this implicitly.)
[tool.setuptools.packages.find]
include = ["nmtcmapper*"]

# The bundled methodology documents are .md, so packages.find alone does not
# carry them into the wheel — setuptools puts only .py files inside a package
# unless package-data says otherwise. MANIFEST.in carries the same path for the
# sdist. Both are needed; neither alone ships the file in both artifacts.
[tool.setuptools.package-data]
"nmtcmapper.methodology" = ["*.md"]

# Register the `live` marker so `@pytest.mark.live` is not an unknown-marker
# warning, and so tests that hit the real Census/CDFI network can be deselected
# in CI with `-m "not live"` (see .github/workflows). Deselection is NOT a skip
# marker — the offline suite runs unconditionally; live tests are opt-in only.
[tool.pytest.ini_options]
markers = [
    "live: exercises the real Census geocoder / CDFI Fund endpoints (network); deselected in CI, run locally with `-m live`",
    # `repo`: this gate reads the REPOSITORY -- docs/, tools/, CHANGELOG.md, or
    # the source tree under nmtcmapper/ -- and is meaningless in a packaged
    # layout. release.yml's test-wheel and test-sdist jobs deliberately run the
    # suite from a directory holding only tests/, pyproject.toml and README.md
    # (that exclusion is what makes them prove the artifact rather than the
    # checkout), so they deselect these with `-m "not live and not repo"`.
    # ci.yml runs from the checkout and keeps every one of them. A gate that
    # reads only README.md or pyproject.toml is NOT repo: both ship beside
    # tests/ in every layout. tests/test_repo_marker.py pins the marked set in
    # both directions; scripts/repro-wheel-tests.sh is the pre-tag check.
    "repo: reads the repository (docs/, tools/, CHANGELOG.md, source files); meaningless in a packaged layout; release.yml deselects with `-m \"not live and not repo\"`",
]
# A parametrized test whose argument list comes out EMPTY is silently marked
# skipped by default, and a skip exits 0. That is the same vacuity class the
# release gates exist to close: the test reports success while asserting
# nothing. fail_at_collect turns "Empty parameter set in 'test_x'" into a
# collection ERROR, so a generator that stops finding inputs fails loudly
# instead of quietly certifying nothing.
empty_parameter_set_mark = "fail_at_collect"
