name: Release

# Release / publish pipeline. Triggered ONLY by pushing a version tag (v*).
#
#   verify-version ─> build ─┬─> test-wheel ─┬─> twine-check ─> publish
#                            ├─> test-sdist ─┤
#                            └─> docs-check ─┘
#
# The three middle jobs answer three different questions and none can answer
# another's:
#   test-wheel  "does the installed wheel work on every supported Python?"
#   test-sdist  "is the source distribution complete?" -- which test-wheel
#               structurally CANNOT answer, because it sources tests/ from the
#               git checkout, so a tarball shipping no tests at all would still
#               go green.
#   docs-check  "does the README describe the artifact we are about to ship?"
#
# Working principle: a gate must consume the artifact it certifies. A gate that
# cannot fail is worse than no gate, because it converts an unknown into a
# false assurance. Two live examples in this repo motivated the rewrite below:
#
#   1. The previous test-wheel job ran
#        python -c "import nmtcmapper; print(nmtcmapper.__version__)"
#      from the checkout root. `python -c` puts the cwd on sys.path, so that
#      import resolved to ./nmtcmapper/__init__.py -- the SOURCE TREE, not the
#      wheel. Worse, __version__ here is read from installed distribution
#      metadata via importlib.metadata, so the check reported the correct
#      version anyway and passed. It was structurally incapable of failing on
#      the thing it claimed to verify. Verified locally: from the repo root the
#      import resolves to ./nmtcmapper/__init__.py; from a clean dir it resolves
#      into site-packages.
#
#   2. There was no sdist job at all, and no MANIFEST.in. setuptools' legacy
#      sdist default matches only tests/test*.py, so the 0.4.1 tarball shipped
#      without tests/conftest.py or tests/__init__.py. conftest.py defines all
#      three fixtures the suite uses, so installing that sdist and running its
#      own tests/ gave 81 passed / 33 errors. Every gate was green.
#
# Publishing is OIDC Trusted Publisher only (no API token). The Trusted
# Publisher is registered against workflow file `release.yml` and environment
# `pypi` -- the filename of THIS file and the `environment:` key on the publish
# job are both load-bearing for the OIDC claim match.

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; only `publish` overrides this.
permissions:
  contents: read

jobs:
  # ── 1. Version drift guard ────────────────────────────────────────────────
  # NOTE for anyone porting cdfi-fund-tracker's tri-source guard here: it does
  # not apply to this repo, and forcing it would mean inventing a version source
  # that does not exist. nmtc-mapper has exactly ONE authoritative version:
  #   pyproject.toml [project].version        <- the only literal
  #   setup.py                                 <- bare shim, `setup()`, no version
  #   nmtcmapper/__init__.py                   <- __version__ is read at runtime
  #                                               from importlib.metadata, i.e.
  #                                               DERIVED from installed dist
  #                                               metadata, not declared
  # So instead of comparing three sources, this job compares the tag to the one
  # real source AND asserts the other two have not grown a competing literal --
  # which is the actual drift risk for this layout.
  verify-version:
    name: Verify tag matches pyproject.toml (single-source guard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compare tag to pyproject.toml; assert no competing version source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, os, pathlib, sys, tomllib

          tag = os.environ["TAG"]
          expected = tag[1:] if tag.startswith("v") else tag

          with open("pyproject.toml", "rb") as fh:
              declared = tomllib.load(fh)["project"]["version"]

          print(f"{'git tag':<28}: {tag}")
          print(f"{'expected version':<28}: {expected}")
          print(f"{'pyproject.toml':<28}: {declared}")

          failed = False
          if declared != expected:
              print(f"::error::pyproject.toml declares '{declared}', expected '{expected}' (from tag '{tag}')")
              print("::error::Fix: bump pyproject.toml, commit, delete the tag, re-tag, push again.")
              failed = True

          # Drift guard: setup.py must stay a bare shim. If someone re-adds
          # version= there it becomes a second source that can disagree, which
          # is exactly the failure mode the tri-source guard exists to catch in
          # repos that already have one.
          setup_src = pathlib.Path("setup.py").read_text()
          for node in ast.walk(ast.parse(setup_src)):
              if isinstance(node, ast.Call) and getattr(node.func, "id", None) == "setup":
                  for kw in node.keywords:
                      if kw.arg == "version":
                          print("::error::setup.py has grown a version= kwarg. This repo keeps a "
                                "single version source (pyproject.toml); remove it, or convert "
                                "this job to a full tri-source guard.")
                          failed = True

          # Same guard for a literal __version__ in the package.
          #
          # ast.walk, NOT ast.parse(...).body. __version__ in this package is
          # assigned at lines 16 and 18, INSIDE a try/except PackageNotFoundError
          # -- which is the only place anyone would ever write it. A top-level-only
          # scan therefore finds ZERO assignments and the guard becomes structurally
          # incapable of failing, while still printing "no competing source". That
          # is a false assurance, which is worse than no guard at all -- and it is
          # the exact defect class this job exists to catch, shipped inside the fix
          # for it. Measured on the real file: .body -> 0 hits, ast.walk -> 2.
          # The setup.py guard ten lines above already used ast.walk correctly.
          #
          # AnnAssign is covered too: `__version__: str = "9.9.9"` is the same
          # competing source wearing an annotation.
          init_tree = ast.parse(pathlib.Path("nmtcmapper/__init__.py").read_text())

          # The ONE literal this layout is permitted to contain: the sentinel
          # assigned when the distribution is not installed. Exempt only as an
          # exact value AND only inside an except handler -- so a planted literal
          # cannot hide by moving into the except branch. It is a local-version
          # string that can never be a published release, so it cannot be the
          # competing source this guard is looking for.
          SENTINEL = "0.0.0+unknown"
          in_handler = {
              id(child)
              for node in ast.walk(init_tree)
              if isinstance(node, ast.ExceptHandler)
              for child in ast.walk(node)
          }

          for node in ast.walk(init_tree):
              if isinstance(node, ast.Assign):
                  targets, value = node.targets, node.value
              elif isinstance(node, ast.AnnAssign):
                  targets, value = [node.target], node.value
              else:
                  continue
              if value is None:
                  continue
              if not any(isinstance(t, ast.Name) and t.id == "__version__" for t in targets):
                  continue
              if not isinstance(value, ast.Constant):
                  continue  # e.g. version("nmtc-mapper") -- derived, which is the point
              if value.value == SENTINEL and id(node) in in_handler:
                  continue  # the documented not-installed fallback
              print(f"::error::nmtcmapper/__init__.py line {node.lineno} declares a literal "
                    f"__version__ ({value.value!r}). It is supposed to be derived from "
                    "importlib.metadata. Remove the literal or add it to this guard.")
              failed = True

          if failed:
              sys.exit(1)
          print(f"Version guard passed: pyproject.toml == {expected}, no competing source")
          PY

  # ── 2. Build once, from the tagged commit ─────────────────────────────────
  build:
    name: Build wheel and sdist
    needs: [verify-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build
          ls -l dist/

      # The sdist-completeness assertion lives HERE, not in test-sdist, because
      # this is the only job holding both the checkout and the tarball. It is an
      # exact set comparison rather than a magic number: the previous guard was
      # `-lt 14` while the tarball shipped exactly 14, i.e. zero headroom, so
      # legitimately deleting or merging a single test module failed the job
      # with "check MANIFEST.in" -- blaming packaging for a deliberate source
      # change. The invariant that actually matters is "the tarball contains
      # every test module the repository has", and that needs no threshold.
      #
      # WHAT THIS STEP DOES NOT CERTIFY -- read this before "simplifying" the
      # pipeline down to this one count, and before copying this job into the
      # next repo. It compares test_*.py names ONLY, and setuptools' legacy
      # sdist default ALREADY matches tests/test*.py. So on a completely broken
      # MANIFEST.in this assertion still PASSES. Measured on the pre-fix
      # tarball for this repo: 14 test modules in the checkout, 14 in the
      # sdist, green -- while tests/conftest.py and tests/__init__.py were both
      # absent, which is the 81 passed / 33 errors defect in the header above.
      # conftest.py is not a test_*.py, so nothing here can ever see it go
      # missing.
      #
      # This step fires only where the suite is NESTED, because the default
      # pattern matches nothing below tests/. Verified on pre-fix tarballs
      # across the four repos this job was copied to, plus this one:
      # cdfi-benchmark 5/5 PASS, hmda-analyzer 8/8 PASS, cdfi-data 4/4 PASS,
      # nmtc-mapper 14/14 PASS -- only nmtc-application-builder failed, at 14
      # of 50, and only because 36 of its modules sit below tests/.
      #
      # The check actually doing the work is the required-files loop in
      # test-sdist, which asserts tests/conftest.py, tests/__init__.py,
      # README.md and pyproject.toml are present in the tarball. Delete that
      # loop and keep this count, and the release gate certifies nothing about
      # the file whose absence broke 0.4.1.
      - name: Assert the sdist ships every test module in the checkout
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          # Enumerate with find, NOT `ls tests/test_*.py`: this must see nested
          # test modules. The flat form compared 14 against 14 and passed on
          # nmtc-application-builder while its sdist shipped 14 of 50 modules --
          # the other 36 live below tests/, so neither side ever saw them.
          # Compare on paths relative to the sdist/checkout root. Tarball entries
          # are "<name>-<version>/tests/..."; stripping the first path component
          # makes the two lists directly comparable.
          find tests -name 'test_*.py' | sed 's|^|/|' | sort > "${RUNNER_TEMP}/repo-tests.txt"
          # `|| true` because grep exits 1 on no match, and under `pipefail` that
          # would kill the step before the emptiness check below could report
          # WHY -- failing silently instead of saying "MANIFEST.in matches
          # nothing". Verified: without it, a tarball shipping zero test modules
          # exits 1 with no output at all.
          tar tzf "${SDIST}" | sed 's|^[^/]*||' \
            | { grep -E '^/tests/(.*/)?test_[^/]*\.py$' || true; } | sort \
            > "${RUNNER_TEMP}/sdist-tests.txt"

          echo "test modules in checkout : $(wc -l < "${RUNNER_TEMP}/repo-tests.txt")"
          echo "test modules in sdist    : $(wc -l < "${RUNNER_TEMP}/sdist-tests.txt")"

          if [ ! -s "${RUNNER_TEMP}/sdist-tests.txt" ]; then
            echo "::error::sdist ships no test modules at all — MANIFEST.in matches nothing"
            exit 1
          fi

          MISSING="$(comm -23 "${RUNNER_TEMP}/repo-tests.txt" "${RUNNER_TEMP}/sdist-tests.txt")"
          if [ -n "${MISSING}" ]; then
            echo "::error::sdist is missing test modules that exist in the checkout:"
            echo "${MISSING}"
            echo "::error::Fix MANIFEST.in (recursive-include tests *.py)."
            exit 1
          fi
          echo "sdist ships every test module in the checkout"

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── 3. Test the built WHEEL on every supported Python ─────────────────────
  test-wheel:
    name: test wheel (py${{ matrix.python-version }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors ci.yml and pyproject's requires-python = ">=3.9".
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout (for the tests/ directory only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install the wheel into a fresh venv and test it
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          VPY="${RUNNER_TEMP}/wheel-venv/bin/python"
          "${VPY}" -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          echo "Installing wheel: ${WHEEL}"
          "${VPY}" -m pip install "${WHEEL}" pytest

          # Everything below runs from a directory that does NOT contain
          # ./nmtcmapper. This is load-bearing, not tidiness: `python -c` puts
          # the cwd on sys.path, so the previous version of this step imported
          # the source tree and called it a verified wheel.
          TESTDIR="${RUNNER_TEMP}/wheel-tests"
          mkdir -p "${TESTDIR}"
          cp -R tests "${TESTDIR}/tests"
          # Same reason as test-sdist: [tool.pytest.ini_options] registers the
          # `live` marker, and without the ini file in the run directory this
          # job also emitted PytestUnknownMarkWarning. tests/ already comes from
          # the checkout in this job, so taking pyproject.toml from it too
          # changes nothing about what is under test -- the WHEEL still supplies
          # the package, which is what the origin assertion above pins down.
          cp pyproject.toml "${TESTDIR}/pyproject.toml"
          cd "${TESTDIR}"

          # Assert the import really came from the installed wheel. Without
          # this, the version check below proves nothing -- and in this repo it
          # would still PASS against source, because __version__ comes from
          # importlib.metadata rather than from the module's own code.
          ORIGIN="$("${VPY}" -c 'import nmtcmapper; print(nmtcmapper.__file__)')"
          echo "import resolved to    : ${ORIGIN}"
          case "${ORIGIN}" in
            *"/site-packages/"*) ;;
            *) echo "::error::import nmtcmapper resolved to '${ORIGIN}', not the installed wheel"; exit 1 ;;
          esac

          INSTALLED="$("${VPY}" -c 'import nmtcmapper; print(nmtcmapper.__version__)')"
          EXPECTED="${GITHUB_REF_NAME#v}"
          echo "installed __version__ : ${INSTALLED}"
          echo "expected (from tag)   : ${EXPECTED}"
          if [ "${INSTALLED}" != "${EXPECTED}" ]; then
            echo "::error::Installed wheel reports '${INSTALLED}', expected '${EXPECTED}'"
            exit 1
          fi

          "${VPY}" -m pytest tests -v --tb=short -m "not live" --import-mode=importlib --strict-markers

  # ── 4. Test the built SDIST, running the suite THAT SHIPPED INSIDE IT ─────
  #
  # This job exists because job 3 cannot catch a broken sdist: it copies tests/
  # from the git checkout, so the tarball could ship zero tests and every gate
  # would still be green. That is not hypothetical here -- see the header.
  # Nothing in this job comes from the repository.
  test-sdist:
    name: test sdist (py${{ matrix.python-version }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      # NOTE: deliberately NO actions/checkout. If the checkout is absent, it
      # cannot leak into the thing under test.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Unpack the sdist, install it, and run its own suite
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          echo "sdist under test: ${SDIST}"

          WORK="${RUNNER_TEMP}/sdist-work"
          mkdir -p "${WORK}"
          tar xzf "${SDIST}" -C "${WORK}"
          SRC="$(find "${WORK}" -maxdepth 1 -mindepth 1 -type d)"
          echo "--- files the sdist actually contains ---"
          tar tzf "${SDIST}"

          # Fail with a sentence, not with 33 fixture errors. Without this the
          # suite still "runs" -- it just errors at collection in a way that
          # reads like a broken test rather than broken packaging.
          for required in tests/conftest.py tests/__init__.py README.md pyproject.toml; do
            if [ ! -f "${SRC}/${required}" ]; then
              echo "::error::sdist is missing ${required} — check MANIFEST.in (recursive-include tests *.py)"
              exit 1
            fi
          done

          python -m venv "${RUNNER_TEMP}/sdist-venv"
          VPY="${RUNNER_TEMP}/sdist-venv/bin/python"
          "${VPY}" -m pip install --upgrade pip
          "${VPY}" -m pip install "${SDIST}" pytest

          # Run from a directory containing ONLY what the sdist shipped, and NOT
          # ./nmtcmapper. Running from ${SRC} itself would put the unpacked
          # source tree on sys.path and silently test that instead.
          TESTDIR="${RUNNER_TEMP}/sdist-tests"
          mkdir -p "${TESTDIR}"
          cp -R "${SRC}/tests" "${TESTDIR}/tests"
          cp "${SRC}/README.md" "${TESTDIR}/README.md"
          # pyproject.toml comes along FROM THE TARBALL (not the repo -- this job
          # still has no checkout) because it carries [tool.pytest.ini_options],
          # where the `live` marker is registered. Without it pytest finds no ini
          # file here, the registration never applies, and the run emitted
          # PytestUnknownMarkWarning while still passing. That is a latent break:
          # the marker is what `-m "not live"` deselects on, so --strict-markers
          # turns the warning into a collection ERROR. Verified both ways.
          cp "${SRC}/pyproject.toml" "${TESTDIR}/pyproject.toml"
          cd "${TESTDIR}"

          ORIGIN="$("${VPY}" -c 'import nmtcmapper; print(nmtcmapper.__file__)')"
          echo "import resolved to    : ${ORIGIN}"
          case "${ORIGIN}" in
            *"/site-packages/"*) ;;
            *) echo "::error::import nmtcmapper resolved to '${ORIGIN}', not the installed sdist"; exit 1 ;;
          esac

          INSTALLED="$("${VPY}" -c 'import nmtcmapper; print(nmtcmapper.__version__)')"
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [ "${INSTALLED}" != "${EXPECTED}" ]; then
            echo "::error::Installed sdist reports '${INSTALLED}', expected '${EXPECTED}'"
            exit 1
          fi

          # --strict-markers so an unregistered marker can never again pass as a
          # warning: if the ini file stops reaching this directory, the job fails
          # loudly instead of silently deselecting nothing.
          # --junitxml so the NEXT step can count what actually executed. The
          # module-count check alone cannot: see the note there.
          "${VPY}" -m pytest tests -m "not live" --import-mode=importlib --strict-markers \
            --junitxml="${RUNNER_TEMP}/sdist-junit.xml"

      - name: Assert the sdist suite is not silently truncated
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          SHIPPED="$(tar tzf "${SDIST}" | grep -c '/tests/test_.*\.py$' || true)"
          echo "test modules in sdist: ${SHIPPED}"
          # This job deliberately has NO checkout, so it cannot compare the
          # tarball against the repository -- that exact comparison lives in
          # `build`, which holds both. What this job CAN assert with nothing but
          # the tarball is that MANIFEST.in did not match nothing at all, which
          # is the failure that would otherwise let the suite "pass" by running
          # zero tests. Deliberately not an absolute threshold: the old `-lt 14`
          # was pinned to the exact count shipping that day, so removing any one
          # test module failed this job with a packaging error for a source
          # change that packaging had nothing to do with.
          if [ "${SHIPPED}" -eq 0 ]; then
            echo "::error::sdist ships no test modules at all — MANIFEST.in matches nothing"
            exit 1
          fi

          # The check above counts MODULES SHIPPED. It never counts EXECUTIONS,
          # and those are different numbers: a suite where every test skips or
          # is deselected exits 0 while shipping every module it should.
          #   2 skipped in 0.00s     -> pytest exit code 0
          #   1 deselected in 0.00s  -> pytest exit code 0
          # This job passes `-m "not live"`, so it is directly exposed: widen
          # that expression, or re-mark the suite `live`, and every test is
          # deselected while the module count stays untouched and every gate
          # stays green. That is the same vacuity class as an empty parametrize,
          # at job scale -- see empty_parameter_set_mark in pyproject.toml for
          # the small-scale version.
          #
          # FLOOR DERIVATION -- not a number picked to be safe, and the reason
          # this is not another `-lt 14`. The rule is HALF of what the suite
          # genuinely runs today, rounded down to a round number. Measured on
          # this tarball: 111 tests executed under this job's exact invocation
          # (3 more are `live` and deselected, and are correctly NOT counted
          # toward the floor). Half is 55, so the floor is 55.
          #
          # Half, deliberately: the rejected `-lt 14` threshold sat at the
          # exact count shipping that day, so deleting one test module failed
          # the job with a packaging error for a deliberate source change.
          # This one has 56 tests of headroom -- you would have to delete more
          # than half the suite before it complains, while total deselection
          # lands at 0 and trips it immediately.
          FLOOR=55
          EXECUTED="$(python - "${RUNNER_TEMP}/sdist-junit.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          # Deselected tests never appear in the report at all, so they are
          # absent from `total` -- which is exactly what makes this catch them.
          print(total - skipped)
          PY
          )"
          echo "tests actually executed: ${EXECUTED}  (floor ${FLOOR})"
          if [ "${EXECUTED}" -lt "${FLOOR}" ]; then
            echo "::error::the sdist suite executed only ${EXECUTED} tests, below the floor of ${FLOOR}."
            echo "::error::Shipping every test module is not the same as running them. Check for a"
            echo "::error::marker change or an -m expression that deselected the suite. If the suite"
            echo "::error::genuinely shrank by more than half, re-derive FLOOR from the new count."
            exit 1
          fi

  # ── 5. docs-check: does the README describe the artifact being shipped? ───
  # Runs against the installed WHEEL, from a directory with no ./nmtcmapper --
  # the same rule as every other gate here, for the same reason.
  docs-check:
    name: docs-check (README vs installed wheel)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        # 3.12 for tomllib, which docs_check.py uses to read docs-check.toml.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Run docs-check against the installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/docs-venv"
          VPY="${RUNNER_TEMP}/docs-venv/bin/python"
          "${VPY}" -m pip install --upgrade pip
          "${VPY}" -m pip install "$(ls dist/*.whl)" pytest

          DOCSDIR="${RUNNER_TEMP}/docs-check"
          mkdir -p "${DOCSDIR}/docs"
          cp -R tests "${DOCSDIR}/tests"
          cp -R tools "${DOCSDIR}/tools"
          # docs/README.expected is optional, for the same reason setup.py is:
          # a repo adopting this gate may have no docs/ directory at all
          # (hmda-analyzer, next in the release queue, does not). Copying it
          # unconditionally under `set -e` ABORTS THE JOB on such a repo -- the
          # step dies at a file copy, before the gate ever runs, so the operator
          # sees an infrastructure error instead of a documentation verdict.
          # When it is absent the gate still fails, but it fails AT THE GATE and
          # says why: every 'run' block reports its missing expected-output file.
          if [ -d docs/README.expected ]; then
            cp -R docs/README.expected "${DOCSDIR}/docs/README.expected"
          fi
          cp README.md pyproject.toml docs-check.toml \
             docs-check-denylist.txt "${DOCSDIR}/"
          # setup.py is optional: 6 of the 22 repos in this portfolio are
          # pyproject-only, so copying it unconditionally would make this job
          # a hard error on adoption rather than a file copy. docs_check.py
          # already logs an absent denylist target as a note. Written as an
          # `if` rather than `[ -f x ] && cp`, because the && form only survives
          # `set -e` while it is not the last statement in the step -- a footgun
          # that arms itself the moment someone appends nothing after it.
          if [ -f setup.py ]; then
            cp setup.py "${DOCSDIR}/"
          fi
          cd "${DOCSDIR}"

          "${VPY}" tools/docs_check.py --root .

  # ── 6. Metadata gate ──────────────────────────────────────────────────────
  twine-check:
    name: twine check (sdist + wheel)
    needs: [test-wheel, test-sdist, docs-check]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: twine check --strict
        run: |
          set -euo pipefail
          python -m pip install twine
          ls -l dist/
          python -m twine check --strict dist/*

  # ── 7. Publish ────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI (Trusted Publisher / OIDC)
    needs: [verify-version, build, test-wheel, test-sdist, docs-check, twine-check]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nmtc-mapper/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # Default is already true on v1.11+; stated explicitly so a future
          # action upgrade cannot silently drop provenance.
          attestations: true
