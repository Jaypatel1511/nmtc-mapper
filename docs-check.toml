# docs-check configuration.
#
# Adopting this gate in another repo is a copy of tools/docs_check.py plus an
# edit of this file. The only fields that are repo-specific are
# [package].import_name and, if the layout differs, the paths below.

[package]
# The IMPORT name, not the PyPI name. nmtc-mapper on PyPI -> nmtcmapper here.
#
# May also be a LIST when one distribution ships more than one documented
# import path, e.g. hmda-analyzer:
#     import_name = ["hmdaanalyzer", "hmda_analyzer"]
# Every name listed is resolved, vetted for site-packages origin, and used for
# assertions 2 and 6. Configuring only one of two working import paths leaves
# the other unverified while the gate still reports green.
import_name = "nmtcmapper"
readme = "README.md"

# Assertion 6: every name in __all__ must appear somewhere in the README.
# Default true. Turning it off is a decision to stop checking whether the
# public API is documented at all -- record why, here, if you ever do.
require_all_documented = true

[expected]
# Committed stdout for every block marked '# docs-check: run', so a change in
# documented output shows up as a reviewable diff in the PR rather than as a
# number nobody re-derived. Each 'run' block needs its OWN name; two blocks
# sharing one expected file is a failure, not a convenience.
dir = "docs/README.expected"

[tests]
path = "tests"
# Matches a line like "114 tests across all modules ...". If the README makes no
# such claim the assertion is skipped -- but if it makes one, it must be true.
claim_pattern = '^(\d+)\s+tests\b'

[denylist]
file = "docs-check-denylist.txt"
# pyproject.toml is scanned only across [project].description and .keywords --
# the fields that become the PyPI project page. setup.py is scanned whole.
targets = ["README.md", "pyproject.toml", "setup.py"]

# ---------------------------------------------------------------------------
# WHAT THIS GATE ASSERTS, AND WHAT IT DOES NOT
#
# An operator looking at a green check should be able to learn its scope from
# here, without reading the source. A gate whose boundary is undocumented gets
# read as covering everything, which is how a passing check becomes a false
# assurance.
#
# IT ASSERTS:
#   1. Every README block marked 'run' produces exactly its committed stdout.
#   2. Every symbol a README block names as importable actually imports.
#   3. Any "N tests" claim matches what pytest collects.
#   4. No retired claim from the denylist survives in README.md, setup.py, or
#      pyproject's [project].description / .keywords.
#   5. The package under test resolved out of site-packages, not the checkout.
#   6. Every name in __all__ appears somewhere in the README.
#
# IT DOES NOT ASSERT -- these are outside the gate, and a green check says
# nothing about any of them:
#   * PROSE CLAIMS. "1,408 of the 8,764 OZ designations (~16%)", "85,395
#     tracts", "fails loud since 0.3.4", the eligibility thresholds in the
#     distress table -- no assertion re-derives any number or behaviour stated
#     in prose. They are checked by a human or not at all.
#   * INSTANCE ATTRIBUTES AND METHODS. Assertion 2 resolves only top-level
#     importable names. `mapper.enrich`, `result.summary()`,
#     `result.eligibility_status`, `NMTCMapper.from_sample` are never resolved,
#     so the README can rename or delete any of them and stay green.
#   * THE OUTPUT-COLUMNS TABLE. The nine columns listed under "Output Columns"
#     are not compared against what .enrich() actually returns. Nothing runs
#     .enrich() -- it needs the multi-MB CDFI Fund download.
#   * THE EXCEPTION HIERARCHY'S SHAPE. Assertion 6 checks that each exception
#     NAME appears in the README. It does not check the inheritance
#     relationships the README draws (NMTCMapperError -> EligibilityDataError
#     -> *DownloadError); a rewiring of the hierarchy stays green.
#   * SKIPPED BLOCKS' RUNTIME BEHAVIOUR. Four of five blocks are skip-marked
#     because they need network. Their code is scanned for symbols and never
#     executed, so a skipped block can be wrong in every way except naming a
#     non-existent import.
#   * Code inside blockquotes or list items, and >>> doctest blocks -- see the
#     KNOWN LIMITATIONS section of tools/docs_check.py.
#
# ---------------------------------------------------------------------------
# Known failures -- tracked documentation debt.
#
# Every entry is a CLAIM THAT SOMETHING IS BROKEN. Entries are printed loudly on
# every run, never hidden. An entry that starts passing FAILS the gate, so this
# list cannot quietly accumulate dead weight. An empty list is the goal state.
#
# `id` values come from the [bracketed] identifier docs_check.py prints for each
# finding.
#
# ---------------------------------------------------------------------------
#
# WHY THIS LEDGER IS EMPTY AGAIN — AND WHY THAT NOW MEANS SOMETHING.
#
# It was empty before 0.5.0, and the emptiness was WRONG. The gate's first five
# assertions all run README -> package: each starts from something the README says
# and asks whether the package agrees. That direction catches DRIFT and is
# structurally incapable of catching OMISSION -- a public symbol the README simply
# never mentions. Since every real defect in this README was an omission or a prose
# claim, the gate passed with all of them live, and the empty ledger read as
# "clean" when it actually meant "nothing was looked at from this side".
#
# Assertion 6 was then added, runs package -> README, and found TWELVE undocumented
# exports: three core public names (EligibilityResult, load_eligibility_table,
# geocode_address) and the entire nine-class exception leaf set -- of which only
# three had been predicted. All twelve were listed here rather than tuned away, and
# all twelve are CLOSED IN 0.5.0 and removed from this file:
#
#   * Group A -- the three core names now have their own documented block in the
#     Quickstart, with EligibilityResult named as the return type of
#     check_address()/check_tract().
#   * Groups B and C -- the nine exception leaves are documented as ONE ASCII TREE
#     under "Exception hierarchy", copied from exceptions.py's module docstring,
#     with a "raised when" beside each leaf and a worked multi-except example.
#     Prose naming nine classes in a sentence would have satisfied assertion 6 and
#     remained unreadable; a glob (`*DownloadError`) cannot be typed into an except
#     clause at all, which is why four of them counted as undocumented while the
#     README appeared to gesture at them.
#
# The gate is what forced the second half of that. It fails the day any entry
# starts passing without being removed, so closing these twelve could not be done
# quietly, and this list could not quietly accumulate dead weight.
#
# ONE BLIND SPOT WAS CLOSED BY THE SUITE INSTEAD, because no assertion here can
# reach it: `opportunity_zone_status` is a PROPERTY ON AN EXPORTED CLASS, not an
# __all__ name, so assertion 6 cannot see whether it is documented and assertion 2
# never resolves it. It is documented deliberately in 0.5.0 (all three states, and
# what each one asserts) and the exception tree's SHAPE -- which this gate's own
# limitations section says it cannot verify -- is now asserted by
# tests/test_constraints.py rather than left as a documented blind spot.
#
# Still checked and found NOT failing, so deliberately absent:
#   * denylist -- CET1, disparate-impact and "the methodology federal examiners
#     use" are absent from this repo's README.md, setup.py and pyproject
#     description/keywords. Verified by running the gate. They are live in
#     cdfi-benchmark and fair-lending-screener, not here.
#   * assertion 2 -- every top-level name the README's blocks import resolves.
#   * assertion 1 -- both `run` blocks match their committed expected files.
#   * assertion 3 -- the README's test-count claim matches collection.
#   * assertion 6 -- all 18 __all__ exports are mentioned in the README.
#
# An empty list is the goal state, and it is now reached rather than assumed.
